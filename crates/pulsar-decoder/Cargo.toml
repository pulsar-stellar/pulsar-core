[package]
name = "pulsar-decoder"
description = "Typed decoder for Soroban contract events emitted by the Pulsar toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published while the workspace is pre-0.2.0. The decoder now carries real
# content; the release gate flips to published when the version reaches
# v0.2.0-contracts. See ADR-020.
publish = false

[lib]
crate-type = ["rlib"]

# stellar-xdr is the canonical ScVal type set the decoder reads from. The
# `curr` feature selects the current protocol XDR, `std` gives owned collections
# and the error impls, and `base64` provides the base64 XDR codec used for the
# Unknown fallback and decode_base64. See ADR-020 and ADR-022.
# serde carries the DecodedValue wire contract (ADR-021). serde_json is a
# test-only harness for the shared JSON fixtures.
[dependencies]
serde = { version = "1", features = ["derive"] }
stellar-xdr = { workspace = true, features = ["std", "curr", "base64"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
