[workspace]
resolver = "2"
# Cargo treats a glob matching zero directories as a literal path and fails to
# load the workspace, so a glob is only listed once its directory has a member.
# contracts/* resolves from build step 13. crates/* is restored at build step 51
# when crates/pulsar-decoder lands, and that step must not forget the edit.
# See ADR-008.
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/pulsar-stellar/pulsar-core"
authors = ["Pulsar Stellar maintainers"]

# Exact pin per the dependency policy for soroban and stellar crates.
# Held at 26.1.0 stable by ADR-001. Do not move to 27.0.0-rc.
[workspace.dependencies]
soroban-sdk = "=26.1.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Wasm release profile. Size and determinism matter more than compile time
# because the artifact is uploaded to the ledger.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
